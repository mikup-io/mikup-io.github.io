  <style>

  }
  :root[data-theme="dark"]{ --bg:#000; --ink:#ecebe6; --ink-dim:#8f8e88; --accent:#f4d35e; --bar:rgba(24,24,24,.78); --bar-line:rgba(236,235,230,.16); }

  body{ background:var(--bg); color:var(--ink); font-family:"Patrick Hand","Comic Sans MS",cursive,sans-serif; overflow:hidden; }
  #stage{ position:relative; width:100%; height:100%; background:var(--bg); }

  #manualToggle{ display:flex; align-items:center; gap:6px; font-size:18px; color:var(--ink); padding:0 8px; height:38px; border-radius:9px; cursor:pointer; user-select:none; white-space:nowrap; }
  #manualToggle:hover{ background:rgba(236,235,230,.08); }

          #bar .row1{ justify-content:flex-start; gap:4px; }

<body>
  <script>
const C = { chalk:'#ecebe6', dim:'#8f8e88', yel:'#f4d35e', cy:'#7fd3e6', red:'#ff7a6b', grn:'#9be38f', org:'#f5a35c' };
const FONT = { h:'Caveat, "Patrick Hand", cursive', l:'"Patrick Hand", Caveat, cursive' };
const NS = 'http://www.w3.org/2000/svg';

/* ---------- seeded randomness for the hand-drawn wobble ---------- */
let _s = 1;
let layer;
const setDrawingLayer = value => { layer = value; };
const seed = n => { _s = n >>> 0; };
function rnd(){ _s |= 0; _s = _s + 0x6D2B79F5 | 0; let t = Math.imul(_s ^ _s >>> 15, 1 | _s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const j = a => (rnd()*2 - 1) * a;
const f = n => Math.round(n*10)/10;

/* ---------- hand-drawn primitives ---------- */
function seg(a, b, bow){
  const dx=b[0]-a[0], dy=b[1]-a[1], len=Math.hypot(dx,dy)||1;
  const k = j(bow*Math.min(1,len/150) + .5);
  return ` Q${f((a[0]+b[0])/2 - dy/len*k)} ${f((a[1]+b[1])/2 + dx/len*k)} ${f(b[0])} ${f(b[1])}`;
}
function poly(pts, closed=false, bow=3){
  pts = pts.map(p => [p[0]+j(1.2), p[1]+j(1.2)]);
  let d = `M${f(pts[0][0])} ${f(pts[0][1])}`;
  for(let i=1;i<pts.length;i++) d += seg(pts[i-1], pts[i], bow);
  if(closed){
    const a=pts[pts.length-1], s=pts[0], n=pts[1];
    d += seg(a, s, bow);
    d += ` L${f(s[0]+(n[0]-s[0])*.07+j(2))} ${f(s[1]+(n[1]-s[1])*.07+j(2))}`;
  }
  return d;
}
const line = (x1,y1,x2,y2,bow=3) => poly([[x1,y1],[x2,y2]], false, bow);
const rect = (x,y,w,h,bow=3) => poly([[x,y],[x+w,y],[x+w,y+h],[x,y+h]], true, bow);
function ell(cx,cy,rx,ry,a0=-Math.PI/2-.3,sweep=Math.PI*2+.4,wob=.03){
  const n = Math.max(20, Math.round((rx+ry)*Math.abs(sweep)/9));
  const ph = rnd()*6; let d='';
  for(let i=0;i<=n;i++){
    const a = a0 + sweep*i/n;
    const r = 1 + wob*Math.sin(a*2+ph) + (i/n)*.02;
    d += (i?' L':'M') + f(cx+Math.cos(a)*rx*r) + ' ' + f(cy+Math.sin(a)*ry*r);
  }
  return d;
}
function arrow(x1,y1,x2,y2,bow=5,hs=18){
  const a = Math.atan2(y2-y1,x2-x1);
  return [ line(x1,y1,x2,y2,bow),
    `M${f(x2-hs*Math.cos(a-.45))} ${f(y2-hs*Math.sin(a-.45))} L${f(x2)} ${f(y2)} L${f(x2-hs*Math.cos(a+.45))} ${f(y2-hs*Math.sin(a+.45))}` ];
}
function cyl(x,y,w,h){ const rx=w/2, ry=Math.max(9,w*.16);
  return [ ell(x+rx,y,rx,ry), line(x,y,x,y+h,1), line(x+w,y,x+w,y+h,1), ell(x+rx,y+h,rx,ry,0,Math.PI,.01), ell(x+rx,y+h*.5,rx,ry,.1,Math.PI-.2,.01) ]; }
function doc(x,y,w,h){ const c=Math.min(26,w*.25);
  return [ poly([[x,y],[x+w-c,y],[x+w,y+c],[x+w,y+h],[x,y+h]], true, 2), poly([[x+w-c,y],[x+w-c,y+c],[x+w,y+c]], false, 1) ]; }
function monitor(x,y,w,h){ return [ rect(x,y,w,h,2), line(x+w/2,y+h,x+w/2,y+h+28,1), line(x+w/2-40,y+h+30,x+w/2+40,y+h+30,1) ]; }
function phone(x,y,w,h){ return [ rect(x,y,w,h,2), line(x+w/2-12,y+h-14,x+w/2+12,y+h-14,.5) ]; }
function gear(cx,cy,r,t=10){ const pts=[], n=t*4;
  for(let i=0;i<n;i++){ const a=i/n*Math.PI*2, rr=(i%4<2)?r:r*.78; pts.push([cx+Math.cos(a)*rr, cy+Math.sin(a)*rr]); }
  return [ poly(pts,true,.4), ell(cx,cy,r*.32,r*.32) ]; }
function person(x,y,s=1){ return [ ell(x,y,18*s,18*s), line(x,y+19*s,x,y+92*s,2),
  poly([[x-36*s,y+66*s],[x,y+42*s],[x+36*s,y+66*s]],false,2), poly([[x-30*s,y+150*s],[x,y+92*s],[x+30*s,y+150*s]],false,2) ]; }
function bubble(x,y,w,h,tx,ty){ return [ ell(x+w/2,y+h/2,w/2,h/2), poly([[x+w*.28,y+h*.86],[tx,ty],[x+w*.42,y+h*.97]],false,1) ]; }
function star4(cx,cy,r){ const q=()=>`${f(cx+j(r*.08))} ${f(cy+j(r*.08))}`;
  return `M${f(cx)} ${f(cy-r)} Q${q()} ${f(cx+r)} ${f(cy)} Q${q()} ${f(cx)} ${f(cy+r)} Q${q()} ${f(cx-r)} ${f(cy)} Q${q()} ${f(cx)} ${f(cy-r)}`; }
const check = (x,y,s) => poly([[x,y],[x+s*.35,y+s*.4],[x+s,y-s*.5]],false,1);
function folder(x,y,w,h){ return poly([[x,y+14],[x,y],[x+w*.35,y],[x+w*.43,y+14],[x+w,y+14],[x+w,y+h],[x,y+h]],true,1.5); }
function lock(cx,cy,s){ return [ ell(cx,cy,42*s,58*s,Math.PI,Math.PI,.005), rect(cx-62*s,cy,124*s,100*s,2), ell(cx,cy+40*s,10*s,10*s), line(cx,cy+50*s,cx,cy+72*s,.5) ]; }
function globe(cx,cy,r){ return [ ell(cx,cy,r,r), ell(cx,cy,r*.42,r,-Math.PI/2,Math.PI*2+.2,.01), line(cx-r,cy,cx+r,cy,2),
  line(cx-r*.86,cy-r*.5,cx+r*.86,cy-r*.5,2), line(cx-r*.86,cy+r*.5,cx+r*.86,cy+r*.5,2) ]; }
function cube(x,y,s){ const d=s*.4, e=s*.35;
  return [ rect(x,y,s,s,1.2), poly([[x,y],[x+d,y-e],[x+s+d,y-e],[x+s,y]],false,1), poly([[x+s+d,y-e],[x+s+d,y+s-e],[x+s,y+s]],false,1) ]; }
function cloud(cx,cy,rx,ry){ const n=110; let d='';
  for(let i=0;i<=n+5;i++){ const a=-Math.PI/2+i/n*Math.PI*2, r=.86+.2*Math.abs(Math.sin(a*3.5));
    d += (i?' L':'M') + f(cx+Math.cos(a)*rx*r) + ' ' + f(cy+Math.sin(a)*ry*r); }
  return d; }
function scribble(x,y,w,h,n){ const pts=[]; for(let i=0;i<n;i++) pts.push([x+rnd()*w, y+rnd()*h]); return poly(pts,false,30); }

/* ---------- scene builder ---------- */
function B(){
  const ops=[];
  const b = {
    ops,
    p(d,c=C.chalk,w=3){ (Array.isArray(d)?d:[d]).forEach(x => ops.push({k:'p',d:x,c,w})); return b; },
    t(x,y,s,o={}){ ops.push({k:'t',x,y,s,...o}); return b; },
    w(ms){ ops.push({k:'w',ms}); return b; }
  };
  return b;
}
function head(b,n,title,sub,u){
  b.t(110,110,'It means…',{size:32,c:C.dim,f:'l'});
  b.t(110,174,title,{size:58,wt:600,u:u?C.yel:null});
  if(sub) b.t(110,230,sub,{size:34,f:'l'});
  b.w(250);
}

/* dashed versions (one path, many sub-paths) to mark what is optional */
function dashPts(pts, dash=20, gap=13){
  let d='', on=true, left=dash;
  for(let i=1;i<pts.length;i++){
    let [ax,ay]=pts[i-1]; const [bx,by]=pts[i];
    let L=Math.hypot(bx-ax,by-ay);
    while(L>0){
      const s=Math.min(left,L), t=s/Math.hypot(bx-ax,by-ay);
      const nx=ax+(bx-ax)*t, ny=ay+(by-ay)*t;
      if(on) d += ` M${f(ax+j(.8))} ${f(ay+j(.8))} L${f(nx+j(.8))} ${f(ny+j(.8))}`;
      ax=nx; ay=ny; L-=s; left-=s;
      if(left<=0){ on=!on; left=on?dash:gap; }
    }
  }
  return d.trim();
}
const dashRect = (x,y,w,h) => dashPts([[x,y],[x+w,y],[x+w,y+h],[x,y+h],[x,y]]);
function dashEll(cx,cy,rx,ry){ const pts=[]; for(let i=0;i<=72;i++){ const a=i/72*Math.PI*2; pts.push([cx+Math.cos(a)*rx, cy+Math.sin(a)*ry]); } return dashPts(pts,18,12); }
function bolt(x,y,s){ return poly([[x+25*s,y],[x,y+48*s],[x+20*s,y+48*s],[x+8*s,y+90*s],[x+48*s,y+34*s],[x+27*s,y+34*s],[x+40*s,y]],true,1); }
function picture(x,y,w,h){ return [ rect(x,y,w,h,1.5), poly([[x+8,y+h-8],[x+w*.35,y+h*.45],[x+w*.55,y+h*.7],[x+w*.72,y+h*.55],[x+w-8,y+h-8]],false,1), ell(x+w*.75,y+h*.28,9,9) ]; }
function wave(x,y,w,a){ let d=`M${f(x)} ${f(y)}`; for(let i=1;i<=40;i++){ const t=i/40; d+=` L${f(x+w*t)} ${f(y+Math.sin(t*Math.PI*6)*a*(0.3+0.7*Math.abs(Math.sin(t*Math.PI*2.3))))}`; } return d; }
function meas(s,size,fk,wt){
  const el=document.createElementNS(NS,'text');
  el.setAttribute('font-family',FONT[fk||'h']); el.setAttribute('font-size',size); el.setAttribute('font-weight',wt||500);
  el.textContent=s; layer.appendChild(el); const w=el.getBBox().width; el.remove(); return w;
}
function code(b,x,y,toks,size){
  const sp = meas('a a',size,'l') - meas('aa',size,'l');
  toks.forEach(([str,c]) => {
    const lead = str.length - str.trimStart().length, t = str.trim();
    x += lead*sp;
    if(t){ b.t(x,y,t,{size,f:'l',c}); x += meas(t,size,'l'); }
  });
  return x;
}
function head2(b,kick,title,sub,u){
  b.t(110,110,kick,{size:32,c:C.dim,f:'l'});
  b.t(110,174,title,{size:58,wt:600,u:u?C.yel:null});
  if(sub) b.t(110,230,sub,{size:34,f:'l'});
  b.w(250);
}


function definePresentation({ name, id, folder, title, subtitle, publishedAt, ariaLabel, playlist, player = {} }) {
  const scenes = playlist.flatMap(item => {
    const chosen = item.scenes ? item.scenes.map(sceneId => item.episode.scenes.find(scene => scene.id.endsWith('/' + sceneId) || scene.id === sceneId)).filter(Boolean) : item.episode.scenes;
    return chosen.map(scene => ({ ...scene, role: item.role, optional: Boolean(item.optional) }));
  });
  return { name, id, folder, title, subtitle, publishedAt, ariaLabel, scenes, player };
}

const scenes = [

b => {

  b.t(285,700,'microservices',{size:44,a:'middle'});

  for(let k=0;k<14;k++){ const x=1210+rnd()*200, y=390+rnd()*200; b.p(line(x,y+26,x+26,y,1),C.dim,2); }
  b.t(1320,700,'monolith',{size:44,a:'middle'});
  b.t(1320,745,'too rigid',{size:30,a:'middle',f:'l',c:C.dim}).w(250);
  const boxes=[[625,380],[830,380],[728,530]];
  boxes.forEach(([x,y]) => b.p(rect(x,y,145,110),C.yel,3.5));
  b.p(line(770,435,830,435,2),C.yel,2.5).p(line(700,490,760,530,2),C.yel,2.5).p(line(900,490,840,530,2),C.yel,2.5);
  boxes.forEach(([x,y]) => { b.p(line(x+20,y+30,x+110,y+30,1),C.dim,2).p(line(x+20,y+55,x+92,y+55,1),C.dim,2).p(line(x+20,y+80,x+70,y+80,1),C.dim,2); });
  b.t(800,700,'Micro App',{size:48,c:C.yel,a:'middle',wt:700});

},
/* 1 · framework */
b => {
  b.t(800,150,'A framework to',{size:56,a:'middle'});
  b.t(800,228,'simplify and speed up',{size:78,c:C.yel,a:'middle',wt:700,u:C.yel}).w(300);
  b.p(rect(170,360,360,260),C.chalk,3);
  b.p(scribble(200,390,300,200,26),C.dim,2.2);
  b.t(350,675,'complexity',{size:44,a:'middle'}).w(200);
  b.p(arrow(570,490,860,490,6,22),C.yel,4);
  b.t(715,462,'Mikup',{size:40,c:C.yel,a:'middle',wt:700}).w(200);

b => {
  head2(b,'1 · Qualify','give it a name','a unique, absolute Fully Qualified Name');
  b.t(800,330,'[prefix:]resPath[@resParams][.selectors][.extension][?params]',{size:34,a:'middle',f:'l',c:C.dim}).w(300);
  const parts = [
    ['repo/s3:', C.dim, 'prefix', 400],
    ['app/res', C.yel, 'resPath', 700],
    ['@rp1/rp2', C.red, 'resParams', 400],
    ['.s1.s2', C.chalk, 'selectors', 400],
    ['.ext', C.cy, 'extension', 400],
    ['?p1=v1&p2=v2', C.grn, 'params', 400]
  ];
  const SZ = 50, GAP = 6;
  const ws = parts.map(([s,,,wt]) => meas(s,SZ,'l',wt));
  const tot = ws.reduce((a,c)=>a+c,0) + GAP*(parts.length-1);
  let x = 830 - tot/2;
  const x0 = x;
  b.p(poly([[x0-30,440],[x0+tot+35,440],[x0+tot+35,560],[x0-30,560],[x0-80,500]],true,2),C.chalk,3);
  b.p(ell(x0-45,500,9,9),C.chalk,2.5).w(150);
  const xs = [];
  parts.forEach(([s,c,,wt],i) => { xs.push(x); b.t(x,518,s,{size:SZ,f:'l',c,wt}); x += ws[i] + GAP; });
  b.w(250);
  parts.forEach(([s,c,lab],i) => {
    const a = xs[i]+2, z = xs[i]+ws[i]-2, m = (a+z)/2, low = i%2===1;
    b.p(poly([[a,585],[a,598],[z,598],[z,585]],false,.6),c,2.2);
    if(low) b.p(line(m,602,m,640,.5),c,1.6);
    b.t(m, low?675:635, lab, {size:28,a:'middle',f:'l',c});
  });
  b.t(xs[1]+ws[1]/2,715,'the only required part',{size:26,a:'middle',f:'l',c:C.dim}).w(250);
  b.t(800,800,'unambiguous across the whole project',{size:38,a:'middle'});
},

  else if(e.key==='t'||e.key==='T') setClock(!clockOn);
  else if(e.key==='f'||e.key==='F') toggleFs();
  else if(e.key==='p'||e.key==='P') setPencil(!pencilOn);
  else if(e.key==='m'||e.key==='M') setManual(!manual);
  else if(e.key==='Enter'){ if(e.target && e.target.closest && e.target.closest('button')) return; e.preventDefault(); advance(); }
});

async function start(at){
  if(started) return; started = true;
  const first = Number.isInteger(at) ? Math.max(0, Math.min(ORDER.length-1, at)) : 0;
  document.getElementById('start').remove();
  elapsed = 0; stage.classList.add('live');
  try{
    await Promise.race([
      Promise.all([document.fonts.load('600 60px Caveat'), document.fonts.load('40px "Patrick Hand"')]),
      new Promise(r => setTimeout(r, 2500))
    ]);
  }catch(e){}
  showBar();
  runScene(first);
}
document.getElementById('startBtn').onclick = () => start();
document.getElementById('startBtn').focus();

}


presentation.standalone = true;

mountPresentation(presentation);
  </script>
</body>
