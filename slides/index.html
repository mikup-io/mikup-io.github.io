<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mikup Presentations</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #090909; color: #ecebe6; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { width: min(960px, calc(100% - 48px)); padding: 48px 0; }
    h1 { margin: 0 0 10px; font-size: clamp(38px, 7vw, 72px); letter-spacing: -.05em; }
    .intro { margin: 0 0 42px; color: #8f8e88; font-size: 20px; }
    #presentations { display: grid; gap: 14px; }
    .presentation { display: block; padding: 28px 30px; border: 1px solid #35342f; border-radius: 16px; color: inherit; text-decoration: none; background: #151513; transition: border-color .2s, transform .2s; }
    .presentation:hover, .presentation:focus-visible { border-color: #f4d35e; transform: translateY(-2px); outline: none; }
    .open { color: #f4d35e; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    h2 { margin: 7px 0; font-size: 30px; }
    .date { display:block; margin:0 0 7px; color:#8f8e88; font-size:14px; }
    p { margin: 0; color: #b8b7b0; }
    .open { display: block; margin-top: 22px; }
  </style>
</head>
<body>
  <main>
    <h1>Blackboard sessions</h1>
    <p class="intro">Choose a deck to play.</p>
    <section id="presentations" aria-label="Presentations"></section>
  </main>
  <script src="./index.js"></script>
</body>
</html>
